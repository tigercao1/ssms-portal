name: Portal CI

# Portal CI (W3.6): lint → test (coverage) → build. Mirrors the API pipeline.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: portal-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Lint · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test (coverage gate)
        run: npm run test:cov

      - name: Build
        run: npm run build
